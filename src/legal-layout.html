<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{pageTitle}} · boootie</title>
<meta name="description" content="{{pageDescription}}">
<meta name="theme-color" content="#ffffff">
<link rel="canonical" href="{{siteUrl}}/{{pageSlug}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<style>:root{--accent:{{accent}};--on-accent:{{onAccent}}}</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="wrap pt-3">
  <div class="topbar glass">
    <a class="brand" href="/" aria-label="boootie, home" translate="no">boootie</a>
    <a class="motion-toggle" href="/">Back to boootie.com</a>
  </div>
</header>
<main id="main" class="wrap legal py-10 md:py-16">
{{{pageBody}}}
</main>
<footer class="relative border-t border-black/15">
  <div class="wrap flex flex-wrap items-center gap-x-6 gap-y-2 py-8">
    <p class="fine">&copy; {{year}} boootie</p>
    <a class="fine underline" href="/privacy">Privacy Policy</a>
    <a class="fine underline" href="/support">Support</a>
  </div>
</footer>
</body>
</html>
