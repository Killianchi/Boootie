[project]
name = "boootie"
version = "0.1.0"
description = "MCP server that lets Claude see and control an iPhone through macOS iPhone Mirroring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pillow>=10",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
]

[project.scripts]
boootie-mcp = "boootie.server:main"
boootie-check = "boootie.check:main"
boootie-kill = "boootie.killswitch:main"
boootie-runs = "boootie.runlog:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boootie"]
